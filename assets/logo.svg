<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1320" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070c16" />
    </linearGradient>

    <!-- Emerald Primary Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#006233" />
    </linearGradient>

    <!-- Coral / Red Accent Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#D21034" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="900" height="260" rx="24" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Subtle Map Grid Pattern in Background -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="260" />
    <line x1="160" y1="0" x2="160" y2="260" />
    <line x1="260" y1="0" x2="260" y2="260" />
    <line x1="0" y1="65" x2="900" y2="65" />
    <line x1="0" y1="130" x2="900" y2="130" />
    <line x1="0" y1="195" x2="900" y2="195" />
    <!-- Constellation Lines -->
    <circle cx="80" cy="80" r="3" fill="#ffffff" />
    <circle cx="210" cy="60" r="2.5" fill="#ffffff" />
    <circle cx="230" cy="190" r="3" fill="#ffffff" />
    <circle cx="120" cy="200" r="2.5" fill="#ffffff" />
  </g>

  <!-- Logo Icon Mark (Left) -->
  <g transform="translate(60, 30)">
    <!-- Ambient Glow behind emblem -->
    <circle cx="100" cy="100" r="75" fill="#059669" opacity="0.18" filter="url(#glow)" />

    <!-- Outer Squircle / Shield -->
    <rect x="15" y="15" width="170" height="170" rx="36" fill="#131e33" stroke="#334155" stroke-width="1.5" />

    <!-- Polygonal Facets of Algeria / Geo Shape -->
    <!-- Facet 1: Northern Tell -->
    <polygon points="50,65 95,45 130,55 110,88 65,85" fill="#34D399" opacity="0.9" />
    <!-- Facet 2: High Plateaus -->
    <polygon points="65,85 110,88 145,100 135,128 80,120" fill="#10B981" opacity="0.95" />
    <!-- Facet 3: Northern Sahara -->
    <polygon points="80,120 135,128 150,148 100,165 65,140" fill="#059669" opacity="0.9" />
    <!-- Facet 4: Deep Sahara / Hoggar -->
    <polygon points="65,140 100,165 115,160 100,145" fill="#047857" opacity="0.85" />
    <!-- Facet 5: Western Ergs -->
    <polygon points="50,65 65,85 80,120 65,140 45,110 40,80" fill="#065f46" opacity="0.75" />

    <!-- Connecting Network Edges & Nodes -->
    <g stroke="#ffffff" stroke-width="1.5" opacity="0.85">
      <line x1="95" y1="45" x2="110" y2="88" />
      <line x1="110" y1="88" x2="80" y2="120" />
      <line x1="80" y1="120" x2="135" y2="128" />
      <line x1="135" y1="128" x2="100" y2="165" />
      <line x1="65" y1="85" x2="50" y2="65" />
      <line x1="130" y1="55" x2="145" y2="100" />
    </g>

    <!-- Network Nodes (Wilayas) -->
    <circle cx="95" cy="45" r="3.5" fill="#ffffff" />
    <circle cx="130" cy="55" r="3" fill="#ffffff" />
    <circle cx="110" cy="88" r="4" fill="#A7F3D0" />
    <circle cx="65" cy="85" r="3" fill="#ffffff" />
    <circle cx="80" cy="120" r="4" fill="#ffffff" />
    <circle cx="145" cy="100" r="3" fill="#A7F3D0" />
    <circle cx="135" cy="128" r="3.5" fill="#ffffff" />
    <circle cx="100" cy="165" r="4.5" fill="#ffffff" />

    <!-- Floating Geo Pin with Algerian Crescent Star -->
    <g transform="translate(112, 35)" filter="url(#pinShadow)">
      <!-- Pin Body -->
      <path d="M18,0 C8.06,0 0,8.06 0,18 C0,31.5 18,48 18,48 C18,48 36,31.5 36,18 C36,8.06 27.94,0 18,0 Z" fill="url(#redGrad)" />
      <!-- Inner White Circle -->
      <circle cx="18" cy="17" r="10" fill="#ffffff" />
      <!-- Center Red Star Accent -->
      <path d="M18,11 L19.8,14.7 L23.9,15.3 L20.9,18.2 L21.6,22.3 L18,20.4 L14.4,22.3 L15.1,18.2 L12.1,15.3 L16.2,14.7 Z" fill="#D21034" transform="scale(0.65) translate(9.7, 9.2)" />
    </g>
  </g>

  <!-- Brand Typography (Right) -->
  <g transform="translate(290, 75)">
    <!-- Main Title -->
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-1">
      <tspan fill="#F8FAFC">algeria</tspan><tspan fill="#34D399">-geo</tspan>
    </text>

    <!-- Version & Tagline Pill -->
    <g transform="translate(355, 12)">
      <rect x="0" y="0" width="84" height="26" rx="13" fill="#065f46" fill-opacity="0.5" stroke="#10B981" stroke-width="1" />
      <text x="42" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#6EE7B7">v1.1.0</text>
    </g>

    <!-- Subtitle in English -->
    <text x="0" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#94A3B8">
      Algeria's 69 Wilayas, 538 Dairas &amp; 1,541 Communes · Dual TS &amp; Python
    </text>

    <!-- Subtitle in Arabic -->
    <text x="0" y="122" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="17" font-weight="600" fill="#CBD5E1" dir="rtl">
      التقسيم الإداري للجزائر: 69 ولاية، 538 دائرة و1,541 بلدية مع بحث متقدم
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 142)">
      <!-- Badge 1: 69 Wilayas -->
      <rect x="0" y="0" width="94" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="47" y="15" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">69 Wilayas</text>

      <!-- Badge 2: Historical Eras -->
      <rect x="104" y="0" width="112" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="160" y="15" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">48 / 58 / 69 Eras</text>

      <!-- Badge 3: Fuzzy Search -->
      <rect x="226" y="0" width="118" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="285" y="15" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Ar / Fr / En Search</text>

      <!-- Badge 4: Zero Deps -->
      <rect x="354" y="0" width="95" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="401" y="15" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#34D399">0 Run-deps</text>
    </g>
  </g>
</svg>
